name: Add dataset to CSV

on:
  issues:
    types: [closed]

permissions:
  contents: write
  actions: write  # needed to dispatch the Sort Datasets workflow

jobs:
  add-dataset:
    if: contains(github.event.issue.labels.*.name, 'dataset-suggestion-approved')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Parse issue and append to CSV
        id: add_dataset
        # Pass issue text via env vars, not inline ${{ }}, so quotes/backticks/$ in it can't break or inject shell
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          pip install pyyaml
          python scripts/add_dataset.py "$ISSUE_BODY" "$ISSUE_TITLE"

      - name: Check for changes
        id: git-check
        if: steps.add_dataset.outcome == 'success'
        run: |
          git diff --exit-code data/bonehub_public_datasets.csv || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/bonehub_public_datasets.csv
          git commit -m "Add dataset from issue #${{ github.event.issue.number }}"
          git push

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the
      # Sort -> Update Webpage -> Deploy chain explicitly (workflow_dispatch is allowed).
      - name: Trigger Sort Datasets workflow
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sort-datasets.yml --ref main
