name: Update Webpage

on:
  # Allow manual trigger
  workflow_dispatch:
  
  # Trigger on push to main branch that modifies the CSV file
  push:
    branches:
      - main
    paths:
      - 'data/bonehub_public_datasets.csv'

permissions:
  contents: write

jobs:
  update-webpage:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Run update script
        run: |
          python scripts/update_webpage.py
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code webpage/data.js || echo "changed=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add webpage/data.js
          git commit -m "Update webpage data from CSV [automated]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
